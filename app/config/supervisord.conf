[unix_http_server]
file=/home/azureuser/nanocortex-web-agent/logs/supervisor.sock

[supervisord]
logfile=/home/azureuser/nanocortex-web-agent/logs/supervisord.log
pidfile=/home/azureuser/nanocortex-web-agent/logs/supervisord.pid
childlogdir=/home/azureuser/nanocortex-web-agent/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/azureuser/nanocortex-web-agent/logs/supervisor.sock

[program:postgres]
command=/home/azureuser/afe_claw/.pixi/envs/default/bin/postgres -D /home/azureuser/nanocortex-web-agent/.pgdata -p 5433
user=azureuser
autostart=true
autorestart=true
priority=10
stdout_logfile=/home/azureuser/nanocortex-web-agent/logs/postgres_stdout.log
stderr_logfile=/home/azureuser/nanocortex-web-agent/logs/postgres_stderr.log
stopwaitsecs=30
stopsignal=INT

[program:backend]
command=/home/azureuser/afe_claw/.pixi/envs/default/bin/uvicorn backend.app.main:app --host 127.0.0.1 --port 9010
directory=/home/azureuser/nanocortex-web-agent
user=azureuser
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/home/azureuser/nanocortex-web-agent/logs/backend_stdout.log
stderr_logfile=/home/azureuser/nanocortex-web-agent/logs/backend_stderr.log
environment=PATH="/home/azureuser/afe_claw/.pixi/envs/default/bin:%(ENV_PATH)s"

[program:frontend]
command=/home/azureuser/afe_claw/.pixi/envs/default/bin/npx vite --host 127.0.0.1 --port 9011
directory=/home/azureuser/nanocortex-web-agent/frontend
user=azureuser
autostart=true
autorestart=true
priority=25
startsecs=5
stdout_logfile=/home/azureuser/nanocortex-web-agent/logs/frontend_stdout.log
stderr_logfile=/home/azureuser/nanocortex-web-agent/logs/frontend_stderr.log
environment=PATH="/home/azureuser/afe_claw/.pixi/envs/default/bin:%(ENV_PATH)s"
