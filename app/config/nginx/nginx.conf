worker_processes auto;
pid /home/azureuser/nanocortex-web-agent/logs/nginx.pid;
error_log /home/azureuser/nanocortex-web-agent/logs/nginx_error.log;

events {
    worker_connections 1024;
}

http {
    include       /home/azureuser/afe_claw/.pixi/envs/default/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths
    proxy_temp_path /home/azureuser/nanocortex-web-agent/logs/nginx_tmp/proxy;
    client_body_temp_path /home/azureuser/nanocortex-web-agent/logs/nginx_tmp/client_body;
    fastcgi_temp_path /home/azureuser/nanocortex-web-agent/logs/nginx_tmp/fastcgi;
    uwsgi_temp_path /home/azureuser/nanocortex-web-agent/logs/nginx_tmp/uwsgi;
    scgi_temp_path /home/azureuser/nanocortex-web-agent/logs/nginx_tmp/scgi;

    access_log /home/azureuser/nanocortex-web-agent/logs/nginx_access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=nanocortex:10m rate=30r/s;

    # Upstream: FastAPI backend
    upstream backend {
        server 127.0.0.1:9010;
    }

    # Upstream: Vite frontend
    upstream frontend {
        server 127.0.0.1:9011;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 8080;
        server_name nanocortex.afe.digital;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: nanocortex.afe.digital
    server {
        listen 8443 ssl;
        server_name nanocortex.afe.digital;

        ssl_certificate /home/azureuser/afe_claw/config/ssl/afe.digital/fullchain.cer;
        ssl_certificate_key /home/azureuser/afe_claw/config/ssl/afe.digital/afe.digital.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_req zone=nanocortex burst=50 nodelay;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location /uploads/ {
            alias /home/azureuser/nanocortex-web-agent/uploads/;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (Vite HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
